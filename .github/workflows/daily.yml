name: Autogenerowanie Pigułki Wiedzy

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uruchomienie skryptu generowania pigułki
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-pill.js

      - name: Zapisanie zmian w repozytorium
        run: |
          git config --global user.name "Astra Bot"
          git config --global user.email "bot@astra.app"
          git add index.html
          git commit -m "Automatyczna obszerna pigułka wiedzy: $(date +'%Y-%m-%d')" || exit 0
          git push
