name: Autogenerowanie Pigułki

on:
  schedule:
    - cron: '0 4 * * *' # Odpala się automatycznie codziennie o 04:00 rano
  workflow_dispatch: # Pozwala ręcznie odpalić test w zakładce Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generowanie nowej pigułki wiedzy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          async function generate() {
            if (!process.env.GEMINI_API_KEY) {
              console.error("BŁĄD: Brak klucza GEMINI_API_KEY w Secrets!");
              process.exit(1);
            }

            const today = new Date().toISOString().split("T")[0];
            const prompt = `Wygeneruj 1 ciekawą pigułkę wiedzy o świecie, biologii, psychologii lub kosmosie. Odpowiedz WYŁĄCZNIE w formacie czystego JSON bez znaczników markdown. Struktura JSON: {"id": "pill-${Date.now()}", "title": "Tytuł", "desc": "Opis", "category": "ciało", "date": "${today}", "timeToRead": "3 min", "icon": "sparkles", "slides": [{"title": "Slajd 1", "content": "Treść..."}], "quiz": {"question": "Pytanie?", "options": ["A", "B", "C"], "correct": 0}}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`;
            
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await res.json();

            if (!res.ok) {
              console.error("BŁĄD API GEMINI:", JSON.stringify(data));
              process.exit(1);
            }

            if (!data.candidates || !data.candidates[0]?.content?.parts[0]?.text) {
              console.error("Nieprawidłowa odpowiedź z Gemini:", JSON.stringify(data));
              process.exit(1);
            }

            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();

            let newPill;
            try {
              newPill = JSON.parse(rawText);
            } catch (err) {
              console.error("Błąd parsowania JSON:", rawText);
              process.exit(1);
            }

            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace("const defaultPills = [", "const defaultPills = [\n      " + JSON.stringify(newPill) + ",");
            fs.writeFileSync("index.html", html);
            console.log("Pomyślnie dodano pigułkę:", newPill.title);
          }
          generate();
          '

      - name: Zapisanie zmian w repozytorium
        run: |
          git config --global user.name "Astra Bot"
          git config --global user.email "bot@astra.app"
          git add index.html
          git commit -m "Automatyczna pigułka wiedzy na dzień: $(date +'%Y-%m-%d')" || exit 0
          git push
