          }
        ],
        quiz: {
          question: 'Co sprawia, że czas płynie w naszej percepcji wolniej?',
          options: ['Rutyna i wykonywanie tych samych czynności', 'Dostarczanie mózgowi nowych, nieznanych doświadczeń', 'Szybkie bieganie'],
          correct: 1
        }
      }
    ];

    // STATE & LOCAL STORAGE DATA
    let pills = defaultPills;
    let savedIds = JSON.parse(localStorage.getItem('astra_saved')) || [];
    let completedIds = JSON.parse(localStorage.getItem('astra_completed')) || [];
    let streakCount = parseInt(localStorage.getItem('astra_streak')) || 0;
    let lastCompletedDate = localStorage.getItem('astra_last_date') || null;

    let currentFilter = 'all';
    let currentPill = null;
    let currentSlideIndex = 0;
    let countdownInterval = null;

    // POMOCNICZE DATY KALENDARZOWE (00:00 - 23:59)
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getYesterdayStr() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function updateStreakSystem() {
      const today = getTodayStr();
      const yesterday = getYesterdayStr();

      // Zerowanie serii jeśli pominięto dzień
      if (lastCompletedDate && lastCompletedDate !== today && lastCompletedDate !== yesterday) {
        streakCount = 0;
        localStorage.setItem('astra_streak', streakCount);
      }

      const streakEl = document.getElementById('streakCount');
      if (streakEl) streakEl.innerText = streakCount;
    }

    function getNext8AM() {
      const now = new Date();
      const target = new Date(now);
      target.setHours(8, 0, 0, 0);
      if (now >= target) {
        target.setDate(target.getDate() + 1);
      }
      return target;
    }

    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);

      function updateTimer() {
        const now = new Date();
        const target = getNext8AM();
        const diff = target - now;

        if (diff <= 0) {
          setupDailyPill();
          return;
        }

        const hours = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        const seconds = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

        const timerEl = document.getElementById('countdownTimer');
        if (timerEl) {
          timerEl.innerText = `${hours}h ${minutes}m ${seconds}s`;
        }
      }

      updateTimer();
      countdownInterval = setInterval(updateTimer, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('astra_theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').setAttribute('data-lucide', 'moon');
      }

      updateStreakSystem();
      lucide.createIcons();
      generateAppIconCanvas();
      setupDailyPill();
      renderPills();
      setupKeyboardListeners();
    });

    function generateAppIconCanvas() {
      const canvas = document.getElementById('iconCanvas');
      const ctx = canvas.getContext('2d');
      
      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#0b0f19');
      grad.addColorStop(0.5, '#1e1b4b');
      grad.addColorStop(1, '#05070c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#ffffff';
      for(let i=0; i<40; i++) {
        ctx.globalAlpha = Math.random() * 0.7;
        ctx.beginPath();
        ctx.arc(Math.random()*512, Math.random()*512, Math.random()*2.5, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.shadowColor = '#818cf8';
      ctx.shadowBlur = 40;
      
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const cx = 256, cy = 256, outer = 160, inner = 45;
      for (let i = 0; i < 8; i++) {
        let r = (i % 2 === 0) ? outer : inner;
        let a = (i * Math.PI) / 4 - Math.PI/2;
        let x = cx + Math.cos(a) * r;
        let y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();

      const dataUrl = canvas.toDataURL('image/png');
      let link = document.querySelector("link[rel*='apple-touch-icon']") || document.createElement('link');
      link.type = 'image/png';
      link.rel = 'apple-touch-icon';
      link.href = dataUrl;
      document.getElementsByTagName('head')[0].appendChild(link);
    }

    function setupDailyPill() {
      const todayStr = getTodayStr();
      const banner = document.getElementById('dailyBanner');
      const dateFormatted = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });

      let dailyPill = pills.find(p => p.date === todayStr);
      if (!dailyPill) dailyPill = pills.find(p => !completedIds.includes(p.id));
      if (!dailyPill) dailyPill = pills[0];

      if (!dailyPill) return;

      const isCompleted = completedIds.includes(dailyPill.id);

      if (isCompleted) {
        banner.className = "relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950 to-star-900 text-white p-6 shadow-xl border border-indigo-500/20";
        banner.innerHTML = `
          <div class="absolute -right-8 -bottom-8 w-40 h-40 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

          <div class="flex items-center justify-between mb-3">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 border border-emerald-400/30 text-emerald-300">
              <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400"></i> Dawka przyjęta
            </span>
            <span class="text-xs font-medium text-slate-400 capitalize">${dateFormatted}</span>
          </div>

          <h2 class="text-xl font-extrabold mb-1.5 leading-snug">Mózg doładowany na dziś! 🚀</h2>
          <p class="text-xs text-slate-300 leading-relaxed mb-4">
            Dzisiejsza wiedza została przyswojona. Daj neuronom czas na poukładanie informacji!
          </p>

          <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-3.5 flex items-center justify-between gap-3 mb-3">
            <div class="flex items-center gap-3">
              <div class="p-2 rounded-xl bg-indigo-500/20 border border-indigo-400/30 text-indigo-300">
                <i data-lucide="clock" class="w-4 h-4"></i>
              </div>
              <div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Nowa pigułka za</p>
                <p id="countdownTimer" class="text-sm font-black tracking-wider text-white font-mono">00h 00m 00s</p>
              </div>
            </div>
            <span class="text-[10px] font-bold text-indigo-300 bg-indigo-500/20 px-2.5 py-1 rounded-lg border border-indigo-500/30">Jutro o 08:00</span>
          </div>

          <button onclick="openReader('${dailyPill.id}')" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-white transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Przejrzyj dzisiejszą wiedzę ponownie
          </button>
        `;
        startCountdown();
      } else {
        if (countdownInterval) clearInterval(countdownInterval);
        banner.className = "relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-star-900 text-white p-6 shadow-xl border border-indigo-400/30";
        banner.innerHTML = `
          <div class="absolute -right-8 -bottom-8 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

          <div class="flex items-center justify-between mb-3">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-white/20 backdrop-blur-md border border-white/30 text-white">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Dzisiejsza Pigułka
            </span>
            <span class="text-xs font-medium text-indigo-200 capitalize">${dateFormatted}</span>
          </div>

          <h2 class="text-xl font-extrabold mb-2 leading-snug">${dailyPill.title}</h2>
          <p class="text-xs text-indigo-100/90 mb-4 line-clamp-2">${dailyPill.desc}</p>

          <button onclick="openReader('${dailyPill.id}')" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-white text-indigo-950 font-bold text-sm shadow-lg hover:bg-indigo-50 active:scale-95 transition">
            <i data-lucide="play" class="w-4 h-4 fill-indigo-950"></i> Otwórz dzisiejszą pigułkę
          </button>
        `;
      }

      lucide.createIcons();
    }

    function renderPills() {
      const container = document.getElementById('pillsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      let filtered = pills.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchVal) || p.desc.toLowerCase().includes(searchVal);
        if(currentFilter === 'all') return matchesSearch;
        if(currentFilter === 'saved') return matchesSearch && savedIds.includes(p.id);
        return matchesSearch && p.category === currentFilter;
      });

      if(filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i data-lucide="sparkles" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
            <p class="text-sm font-medium">Brak pigułek spełniających kryteria</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(pill => {
        const isSaved = savedIds.includes(pill.id);
        const isCompleted = completedIds.includes(pill.id);

        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group`;
        card.onclick = () => openReader(pill.id);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200/40 dark:border-indigo-800/40">
                ${pill.category}
              </span>
              <div class="flex items-center gap-2">
                ${isCompleted ? '<span class="text-emerald-500 text-xs font-bold flex items-center gap-1"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Przeczytane</span>' : ''}
                <button onclick="event.stopPropagation(); toggleBookmark('${pill.id}')" class="p-1 text-slate-400 hover:text-amber-500 transition">
                  <i data-lucide="star" class="w-4 h-4 ${isSaved ? 'fill-amber-400 text-amber-400' : ''}"></i>
                </button>
              </div>
            </div>

            <h3 class="font-bold text-base text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition mb-1 leading-snug">
              ${pill.title}
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed mb-3">
              ${pill.desc}
            </p>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/50 text-[11px] text-slate-400">
            <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${pill.timeToRead || '4 min'}</span>
            <span class="font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-0.5">Czytaj wiedzę <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></span>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function openReader(id) {
      currentPill = pills.find(p => p.id === id);
      if(!currentPill) return;

      currentSlideIndex = 0;
      document.getElementById('readerModal').classList.remove('hidden');
      document.getElementById('readerModal').classList.add('flex');
      document.getElementById('readerCategory').innerText = currentPill.category;
      
      updateBookmarkIconState();
      renderSlide();
    }

    function closeReader() {
      document.getElementById('readerModal').classList.add('hidden');
      document.getElementById('readerModal').classList.remove('flex');
      currentPill = null;
    }

    function renderSlide() {
      const container = document.getElementById('slideContent');
      const progressContainer = document.getElementById('progressContainer');
      const totalSlides = currentPill.slides.length + (currentPill.quiz ? 1 : 0);

      progressContainer.innerHTML = '';
      for(let i=0; i<totalSlides; i++) {
        const bar = document.createElement('div');
        bar.className = `h-1 flex-1 rounded-full transition-all duration-300 ${i <= currentSlideIndex ? 'bg-white shadow-[0_0_8px_rgba(255,255,255,0.8)]' : 'bg-white/20'}`;
        progressContainer.appendChild(bar);
      }

      const card = document.getElementById('slideCard');
      card.classList.remove('slide-enter');
      void card.offsetWidth;
      card.classList.add('slide-enter');

      if(currentSlideIndex < currentPill.slides.length) {
        const slide = currentPill.slides[currentSlideIndex];
        container.innerHTML = `
          <h2 class="text-lg md:text-xl font-extrabold text-white leading-tight mb-2">${slide.title}</h2>
          <div class="text-xs md:text-sm text-slate-200 leading-relaxed space-y-2">
            <p>${slide.content}</p>
          </div>
        `;
      } else {
        const q = currentPill.quiz;
        container.innerHTML = `
          <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 font-bold text-xs mb-2">
            🧠 Szybki Quiz Sprawdzający
          </div>
          <h2 class="text-base md:text-lg font-bold text-white mb-3">${q.question}</h2>
          <div id="quizOptions" class="space-y-2">
            ${q.options.map((opt, idx) => `
              <button onclick="checkQuiz(${idx}, ${q.correct})" class="w-full text-left p-3 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 text-xs md:text-sm font-medium transition text-white">
                ${opt}
              </button>
            `).join('')}
          </div>
        `;
      }

      document.getElementById('slideCounter').innerText = `Slajd ${currentSlideIndex + 1} z ${totalSlides}`;
      document.getElementById('prevBtn').disabled = currentSlideIndex === 0;

      const nextBtn = document.getElementById('nextBtn');
      if(currentSlideIndex === totalSlides - 1) {
        nextBtn.innerHTML = 'Ukończ <i data-lucide="check" class="w-5 h-5"></i>';
      } else {
        nextBtn.innerHTML = 'Dalej <i data-lucide="chevron-right" class="w-5 h-5"></i>';
      }

      lucide.createIcons();
    }

    function nextSlide() {
      const totalSlides = currentPill.slides.length + (currentPill.quiz ? 1 : 0);
      if(currentSlideIndex < totalSlides - 1) {
        currentSlideIndex++;
        renderSlide();
      } else {
        const today = getTodayStr();
        const yesterday = getYesterdayStr();

        if(!completedIds.includes(currentPill.id)) {
          completedIds.push(currentPill.id);
          localStorage.setItem('astra_completed', JSON.stringify(completedIds));
          confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
        }

        // AKTUWALIZACJA SERII (STREAK)
        if (lastCompletedDate !== today) {
          if (lastCompletedDate === yesterday) {
            streakCount++;
          } else {
            streakCount = 1;
          }

          lastCompletedDate = today;
          localStorage.setItem('astra_streak', streakCount);
          localStorage.setItem('astra_last_date', lastCompletedDate);
          updateStreakSystem();
        }

        closeReader();
        renderPills();
        setupDailyPill();
      }
    }

    function prevSlide() {
      if(currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide();
      }
    }

    function checkQuiz(selectedIdx, correctIdx) {
      const buttons = document.querySelectorAll('#quizOptions button');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if(idx === correctIdx) {
          btn.className = "w-full text-left p-3 rounded-2xl bg-emerald-500/20 border border-emerald-500 text-xs md:text-sm font-bold text-emerald-300";
        } else if(idx === selectedIdx) {
          btn.className = "w-full text-left p-3 rounded-2xl bg-rose-500/20 border border-rose-500 text-xs md:text-sm font-bold text-rose-300";
        }
      });

      if(selectedIdx === correctIdx) {
        confetti({ particleCount: 40, spread: 50, origin: { y: 0.6 } });
      }
    }

    function setupKeyboardListeners() {
      document.addEventListener('keydown', (e) => {
        if(document.getElementById('readerModal').classList.contains('hidden')) return;
        if(e.key === 'ArrowRight') nextSlide();
        if(e.key === 'ArrowLeft') prevSlide();
        if(e.key === 'Escape') closeReader();
      });
    }

    function toggleBookmark(id) {
      if(savedIds.includes(id)) {
        savedIds = savedIds.filter(i => i !== id);
      } else {
        savedIds.push(id);
      }
      localStorage.setItem('astra_saved', JSON.stringify(savedIds));
      renderPills();
    }

    function toggleBookmarkCurrent() {
      if(!currentPill) return;
      toggleBookmark(currentPill.id);
      updateBookmarkIconState();
    }

    function updateBookmarkIconState() {
      const icon = document.getElementById('readerBookmarkIcon');
      if(savedIds.includes(currentPill.id)) {
        icon.className = "w-5 h-5 fill-amber-400 text-amber-400";
      } else {
        icon.className = "w-5 h-5 text-slate-300";
      }
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
      });
      event.target.classList.add('bg-indigo-600', 'text-white');
      renderPills();
    }

    function handleSearch() {
      renderPills();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      localStorage.setItem('astra_theme', isDark ? 'dark' : 'light');
      lucide.createIcons();
    }

    function openSettingsModal() {
      document.getElementById('geminiApiKeyInput').value = localStorage.getItem('astra_gemini_key') || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('geminiApiKeyInput').value.trim();
      localStorage.setItem('astra_gemini_key', key);
      alert('Klucz API zapisany pomyślnie!');
      closeSettingsModal();
    }
  </script>
</body>
</html>
